<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expressa CMS - Login Admin</title>
  
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: {
              500: '#0066FF',
              600: '#0052CC',
              dark: '#0A0F1D',
              darker: '#060913'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0A0F1D] text-slate-100 min-h-full flex items-center justify-center p-6 relative overflow-hidden font-sans selection:bg-blue-600 selection:text-white">

  <!-- Ambient Glow Effects -->
  <div class="absolute top-1/4 -left-32 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 -right-32 w-96 h-96 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-md">
    <!-- Back to site link -->
    <div class="mb-6 text-center">
      <a href="/" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-400 hover:text-blue-400 transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Kembali ke Landing Page Expressa</span>
      </a>
    </div>

    <!-- Login Card -->
    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 sm:p-10 shadow-2xl shadow-black/60 relative">
      
      <!-- Brand Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-blue-600 text-white font-black text-2xl shadow-lg shadow-blue-600/40 mb-3">
          E
        </div>
        <h1 class="text-2xl font-black tracking-wider text-blue-600">EXPRESSA</h1>
        <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest font-semibold">Content Management System</p>
      </div>

      <!-- Alert Box -->
      <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-xs font-medium border"></div>

      <!-- Form -->
      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">Username</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="user" class="w-4 h-4"></i>
            </div>
            <input type="text" id="username" name="username" required autocomplete="username"
                   placeholder="Masukkan username" value="admin"
                   class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </div>
            <input type="password" id="password" name="password" required autocomplete="current-password"
                   placeholder="Masukkan password" value="admin123"
                   class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" id="btn-submit"
                  class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm py-3.5 px-6 rounded-xl shadow-lg shadow-blue-600/30 hover:shadow-blue-500/50 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            <span id="btn-text">Masuk ke Dashboard</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </div>
      </form>

      <!-- Default Credentials Helper Note -->
      <div class="mt-6 pt-5 border-t border-slate-800 text-center">
        <p class="text-[11px] text-slate-500">
          Akun Default: <span class="text-blue-400 font-mono font-bold">admin</span> / <span class="text-blue-400 font-mono font-bold">admin123</span>
        </p>
      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();

    // Check if already authenticated
    const token = localStorage.getItem('expr_admin_token');
    if (token) {
      fetch('/api/admin/check-auth', {
        headers: { 'Authorization': `Bearer ${token}` }
      })
      .then(res => {
        if (!res.ok) throw new Error('Invalid token');
        return res.json();
      })
      .then(data => {
        if (data && data.authenticated) {
          window.location.href = '/admin';
        } else {
          localStorage.removeItem('expr_admin_token');
          localStorage.removeItem('expr_admin_user');
        }
      })
      .catch(() => {
        localStorage.removeItem('expr_admin_token');
        localStorage.removeItem('expr_admin_user');
      });
    }

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert-box');
    const btnSubmit = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      alertBox.classList.add('hidden');
      btnSubmit.disabled = true;
      btnText.textContent = 'Memverifikasi...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('expr_admin_token', data.token);
          localStorage.setItem('expr_admin_user', data.user.username);
          
          alertBox.className = 'mb-6 p-4 rounded-xl text-xs font-medium border bg-emerald-500/10 border-emerald-500/30 text-emerald-400 block';
          alertBox.textContent = 'Login berhasil! Mengarahkan ke Dashboard...';
          
          setTimeout(() => {
            window.location.href = '/admin';
          }, 600);
        } else {
          alertBox.className = 'mb-6 p-4 rounded-xl text-xs font-medium border bg-rose-500/10 border-rose-500/30 text-rose-400 block';
          alertBox.textContent = data.message || 'Login gagal. Periksa username dan password.';
          btnSubmit.disabled = false;
          btnText.textContent = 'Masuk ke Dashboard';
        }
      } catch (err) {
        alertBox.className = 'mb-6 p-4 rounded-xl text-xs font-medium border bg-rose-500/10 border-rose-500/30 text-rose-400 block';
        alertBox.textContent = 'Gagal menghubungi server. Pastikan server backend berjalan.';
        btnSubmit.disabled = false;
        btnText.textContent = 'Masuk ke Dashboard';
      }
    });
  </script>
</body>
</html>
